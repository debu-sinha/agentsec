name: Weekly MCP Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install agentsec
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Run MCP ecosystem scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_mcp_dashboard.py --scan

      - name: Commit and push dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mcp-security-grades.md docs/mcp-dashboard/ docs/mcp-dashboard/repos/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MCP security dashboard ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - name: Upload scan artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-scan-${{ github.run_id }}
          path: docs/mcp-dashboard/data/
          retention-days: 90
